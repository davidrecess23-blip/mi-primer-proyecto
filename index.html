<!DOCTYPE html>
<html>
  <head>
    <title>Mi pagina ZIYU</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #f0f4f8;
        padding: 40px;
      }
      h1 {
        color: #1a73e8;
      }
      p {
        color: #444444;
        font-size: 18px;
      }
      button {
        background-color: #1a73e8;
        color: white;
        border: none;
        padding: 10px 20px;
        border-radius: 6px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <h1>Hola, soy David</h1>
    <p>Estoy aprendiendo desarrollo web.</p>
    <button>Haz click aqui</button>
    <script>
// 1 - SECUENCIA
const nombre = 'David';
const puerto = 'San Antonio';
console.log('Usuario: ' + nombre);
console.log('Puerto asignado: ' + puerto);

// 2 - CONDICION
const acceso = true;

if (acceso === true) {
  console.log('Acceso permitido al sistema ZIYU');
} else {
  console.log('Acceso denegado');
}

// 3 - REPETICION
const puertos = ['San Antonio', 'Lirquén', 'Columbo'];

for (let i = 0; i < puertos.length; i++) {
  console.log('Puerto ' + (i + 1) + ': ' + puertos[i]);
}
    </script>
  </body>
</html>
