<!DOCTYPE html>
<html>

        color: #1a73e8;

  <body>
    <h1>Hola, soy David</h1>
    <p>Estoy aprendiendo desarrollo web.</p>
    <button>Haz click aqui</button>
    <script>
class Envio {
    constructor(cliente, peso, destino) {
        this.cliente = cliente;
        this.peso = peso;
        this.destino = destino;
        this.entregado = false;
    }

    marcarEntregado() {
        this.entregado = true;
        console.log('Envio de ' + this.cliente + ' marcado como entregado');
    }
}

const envio1 = new Envio('ZIYU', 50, 'San Antonio');
const envio2 = new Envio('RamcoLog', 120, 'Lirquen');

console.log(envio1);
console.log(envio2);

envio1.marcarEntregado();
console.log('Estado envio1:', envio1.entregado);
    </script>
